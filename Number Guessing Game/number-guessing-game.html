<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahrukh's Number Guessing Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1f3d;
    --card: #16264a;
    --line: #26385f;
    --text: #eef2fb;
    --text-dim: #8ea0c7;
    --accent: #ffce54;
    --hot: #ff6b6b;
    --cold: #4fa8e8;
    --win: #4ad991;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #16264a 0%, var(--bg) 70%);
    font-family: 'Fredoka', sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 30px 26px;
    text-align: center;
  }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 6px; }
  .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }

  .range-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .guess-display {
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    min-height: 66px;
    margin-bottom: 6px;
  }
  .feedback {
    font-size: 15px;
    font-weight: 500;
    min-height: 22px;
    margin-bottom: 20px;
  }
  .feedback.hot { color: var(--hot); }
  .feedback.cold { color: var(--cold); }
  .feedback.win { color: var(--win); }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="number"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: var(--accent); }

  .guess-btn {
    background: var(--accent);
    color: #24180a;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .guess-btn:hover { filter: brightness(1.08); }
  .guess-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .history {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 20px;
    min-height: 24px;
  }
  .chip {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .chip.hot { border-color: var(--hot); color: var(--hot); }
  .chip.cold { border-color: var(--cold); color: var(--cold); }

  .new-game-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 20px;
    cursor: pointer;
  }
  .new-game-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="card">
  <h1>Guess the Number</h1>
  <div class="sub">I'm thinking of a number — can you find it?</div>
  <div class="range-label" id="rangeLabel">Between 1 and 100</div>

  <div class="guess-display" id="guessDisplay">?</div>
  <div class="feedback" id="feedback">Make your first guess</div>

  <div class="input-row">
    <input type="number" id="guessInput" placeholder="Enter a number" min="1" max="100">
    <button class="guess-btn" id="guessBtn">Guess</button>
  </div>

  <div class="stats-row">
    <span id="attemptsLabel">Attempts: 0</span>
    <span id="bestLabel">Best: —</span>
  </div>

  <div class="history" id="history"></div>

  <button class="new-game-btn" id="newGameBtn">New Game</button>
</div>

<script>
  const MIN = 1, MAX = 100;
  let target = randomTarget();
  let attempts = 0;
  let bestScore = null;
  let history = [];
  let gameOver = false;

  const guessDisplay = document.getElementById('guessDisplay');
  const feedback = document.getElementById('feedback');
  const guessInput = document.getElementById('guessInput');
  const guessBtn = document.getElementById('guessBtn');
  const attemptsLabel = document.getElementById('attemptsLabel');
  const bestLabel = document.getElementById('bestLabel');
  const historyEl = document.getElementById('history');
  const newGameBtn = document.getElementById('newGameBtn');

  function randomTarget() {
    return Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
  }

  function makeGuess() {
    if (gameOver) return;
    const val = parseInt(guessInput.value, 10);
    if (isNaN(val) || val < MIN || val > MAX) {
      feedback.textContent = `Enter a number between ${MIN} and ${MAX}.`;
      feedback.className = 'feedback';
      return;
    }

    attempts++;
    guessDisplay.textContent = val;

    const diff = Math.abs(val - target);

    if (val === target) {
      feedback.textContent = `🎉 Correct! It was ${target}.`;
      feedback.className = 'feedback win';
      gameOver = true;
      guessBtn.disabled = true;
      if (bestScore === null || attempts < bestScore) {
        bestScore = attempts;
        bestLabel.textContent = `Best: ${bestScore}`;
      }
      addChip(val, 'win');
    } else if (diff <= 5) {
      feedback.textContent = val < target ? '🔥 So close — go higher!' : '🔥 So close — go lower!';
      feedback.className = 'feedback hot';
      addChip(val, 'hot');
    } else {
      feedback.textContent = val < target ? '❄️ Too low, try higher.' : '❄️ Too high, try lower.';
      feedback.className = 'feedback cold';
      addChip(val, 'cold');
    }

    attemptsLabel.textContent = `Attempts: ${attempts}`;
    guessInput.value = '';
    guessInput.focus();
  }

  function addChip(val, type) {
    history.push({ val, type });
    historyEl.innerHTML = history.map(h => `<span class="chip ${h.type}">${h.val}</span>`).join('');
  }

  function newGame() {
    target = randomTarget();
    attempts = 0;
    gameOver = false;
    history = [];
    guessDisplay.textContent = '?';
    feedback.textContent = 'Make your first guess';
    feedback.className = 'feedback';
    attemptsLabel.textContent = 'Attempts: 0';
    historyEl.innerHTML = '';
    guessInput.value = '';
    guessBtn.disabled = false;
    guessInput.focus();
  }

  guessBtn.addEventListener('click', makeGuess);
  guessInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') makeGuess(); });
  newGameBtn.addEventListener('click', newGame);
</script>

</body>
</html>
