<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahrukh's Color Palette Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16161a;
    --panel: #1e1e24;
    --line: #2d2d36;
    --text: #f2f2f5;
    --text-dim: #8b8b96;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 720px; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  .controls { display: flex; gap: 8px; }
  button {
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    border: none;
  }
  .gen-btn {
    background: var(--accent);
    color: #16161a;
    font-weight: 700;
    font-size: 13px;
    padding: 11px 20px;
    border-radius: 8px;
  }
  .gen-btn:hover { filter: brightness(1.08); }
  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 560px) {
    .palette { grid-template-columns: repeat(2, 1fr); }
  }

  .swatch {
    height: 160px;
    border-radius: 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .swatch:hover { transform: translateY(-3px); }

  .lock-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.35);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 13px;
    cursor: pointer;
  }
  .lock-btn.locked { background: rgba(0,0,0,0.6); }

  .hex-label {
    font-size: 13px;
    font-weight: 600;
    background: rgba(0,0,0,0.3);
    padding: 5px 9px;
    border-radius: 6px;
    backdrop-filter: blur(4px);
    align-self: flex-start;
  }
  .copied-tag {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    display: none;
  }
  .copied-tag.show { display: block; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <h1>Color Palette Generator</h1>
      <div class="sub">Click a swatch to copy its hex code. Lock swatches to keep them.</div>
    </div>
    <div class="controls">
      <button class="gen-btn" id="genBtn">Generate</button>
    </div>
  </div>
  <div class="hint">Press <kbd>Space</kbd> to generate a new palette</div>

  <div class="palette" id="palette"></div>
</div>

<script>
  const palette = document.getElementById('palette');
  const genBtn = document.getElementById('genBtn');
  const SWATCH_COUNT = 5;
  let colors = [];
  let locked = new Array(SWATCH_COUNT).fill(false);

  function randomHex() {
    const letters = '0123456789ABCDEF';
    let hex = '#';
    for (let i = 0; i < 6; i++) hex += letters[Math.floor(Math.random() * 16)];
    return hex;
  }

  function contrastColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.55 ? '#16161a' : '#f2f2f5';
  }

  function generate() {
    colors = colors.map((c, i) => locked[i] ? c : randomHex());
    while (colors.length < SWATCH_COUNT) colors.push(randomHex());
    render();
  }

  function render() {
    palette.innerHTML = colors.map((hex, i) => `
      <div class="swatch" style="background:${hex}" data-index="${i}">
        <button class="lock-btn ${locked[i] ? 'locked' : ''}" data-lock="${i}">${locked[i] ? '🔒' : '🔓'}</button>
        <div class="copied-tag" id="copied-${i}">Copied!</div>
        <div class="hex-label" style="color:${contrastColor(hex)}; background: transparent; padding:0;">${hex}</div>
      </div>
    `).join('');

    document.querySelectorAll('.swatch').forEach(sw => {
      sw.addEventListener('click', (e) => {
        if (e.target.closest('.lock-btn')) return;
        const idx = sw.dataset.index;
        navigator.clipboard.writeText(colors[idx]).then(() => {
          const tag = document.getElementById(`copied-${idx}`);
          tag.classList.add('show');
          setTimeout(() => tag.classList.remove('show'), 1000);
        });
      });
    });

    document.querySelectorAll('.lock-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = btn.dataset.lock;
        locked[idx] = !locked[idx];
        render();
      });
    });
  }

  genBtn.addEventListener('click', generate);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.target.matches('input, textarea')) {
      e.preventDefault();
      generate();
    }
  });

  generate();
</script>

</body>
</html>
